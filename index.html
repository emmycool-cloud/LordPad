<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&display=swap" rel="stylesheet">
    <title>Insights</title>
    <link rel="stylesheet" href="style.css">
</head>
 
    <div class="container">
        
        <div class="sidebar">
             <div class="name">
                     <h1 >Insights</h1>
                </div>
                <div class="min_sidebar">
            <button class="add-btn" id="createNewNote">Create note</button>
            <div id="noteList"></div>
        </div>
        </div>
        <div class="main-editor">
           <div class="toolbar">
               
                <input type="text" id="noteTitle" autocomplete="off" placeholder="Untitled">
                <div class="actions">
                     <button class="btn" id="saveNote">Save</button>
                    <button class="btn" id="deleteNote">Delete</button>
                </div>
            </div>
            <textarea  id="noteInput" placeholder="Focus on your thoughts..."></textarea>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
